<!doctype html>
<!--
  index.html — the page the browser opens first.

  It is almost empty on purpose. Its only jobs are to set up the page and then
  hand over to React, which builds everything you actually see. You will hardly
  ever edit this file; the app itself lives in src/.

  Everything you are reading now is an HTML comment: the browser ignores it.
  Comments in HTML start with an angle bracket, an exclamation mark and two
  dashes, and end with two dashes and an angle bracket.
-->
<html lang="en">
  <head>
    <!-- <head> holds information ABOUT the page. Nothing here appears on
         screen — it's instructions for the browser. -->

    <!-- Which alphabet the file uses. UTF-8 covers every language and emoji. -->
    <meta charset="UTF-8" />

    <!-- The little icon shown on the browser tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Essential for a phone app. Without this line a phone pretends to be a
         desktop screen and shrinks the whole page down to unreadable size.
           width=device-width → use the phone's real width
           initial-scale=1.0  → don't zoom in or out to start with
           viewport-fit=cover → allow the page behind rounded corners and the
                                notch, which our safe-area padding accounts for -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Tints the phone's status bar to match the app. The background is a
         gradient, but this can only take one flat colour — so it's the colour
         at the TOP of the gradient, which is the end the status bar sits
         against. Keep it in step with --green-top in src/index.css. -->
    <meta name="theme-color" content="#05690d" />

    <!-- ---- INSTALLING THIS AS A PHONE APP ----------------------------------
         Everything below is what turns this from a web page into something a
         phone will install: tap Share → Add to Home Screen on an iPhone, or
         "Install app" on Android, and it gets its own icon and opens
         full-screen with no browser bar around it.

         It only works over https. Netlify, Vercel and GitHub Pages all give you
         that; opening the built files straight off your disk does not. -->

    <!-- The app's name, colours and icons. Android reads this for everything;
         iOS reads it for the name and the splash screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS uses THIS tag for the home screen icon, not the manifest. Leave it
         out and you get a blurry screenshot of the page instead of an icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Opens full-screen, without Safari's address bar and toolbar. This is
         the single tag that makes it feel like an app rather than a website.
         The second line is the same thing for Android browsers. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Lets the page run BEHIND the status bar, so the green gradient reaches
         the very top of the screen instead of stopping under a grey strip.
         The clock and battery are drawn in white over it, which reads fine on
         the dark green up there.

         This is why .screen in App.css adds env(safe-area-inset-top) to its top
         padding — without that, the heading would sit under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The name shown under the icon on the home screen. -->
    <meta name="apple-mobile-web-app-title" content="Active Living" />

    <!-- The text on the browser tab. -->
    <title>Active Living</title>
  </head>

  <body>
    <!-- <body> is the visible part of the page — and it's nearly empty.

         This one empty div is the box React draws the entire app inside. In
         src/main.jsx the line getElementById('root') is what finds it. -->
    <div id="root"></div>

    <!-- Loads the app. type="module" lets that file use import/export.
         This tag must come last so the div above already exists when it runs. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
